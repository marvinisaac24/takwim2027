    <script>
      // Catch and gracefully handle benign Vite HMR WebSocket disconnections in preview environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason) {
          var msg = (event.reason.message || String(event.reason) || '');
          var stack = (event.reason.stack || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || stack.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event.message || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return false;
        }
      });
    </script>
